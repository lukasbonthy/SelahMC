name: Inspect deferred shader GUI ABI

on:
  push:
    branches: ["inspect-v8.3.11"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stability-v8.3.10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download pinned client
        run: |
          set -euo pipefail
          mkdir -p recovered-live
          curl --fail --location --retry 3 https://selahmc.me/client/selahmc-client-v8.3.3.js --output recovered-live/selahmc-client-v8.3.3.js
      - name: Print deferred GUI functions and class layouts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { transformBundle } from "./lifecycle-repair/tools/build-lifecycle-repair.mjs";
          const source = readFileSync("recovered-live/selahmc-client-v8.3.3.js", "utf8");
          const barrier = readFileSync("lifecycle-repair/src/world-lifecycle-barrier.js", "utf8");
          const { code } = transformBundle(source, barrier);

          function fn(name) {
            const signature = `function ${name}(`;
            const start = code.indexOf(signature);
            const next = code.indexOf("\\nfunction ", start + signature.length);
            console.log(`--- ${name} start=${start} end=${next} ---`);
            console.log(code.slice(start, next < 0 ? code.length : next));
          }

          for (const name of [
            "SD_BQs", "BQs", "SD_BUt", "SD_Eim", "SD_DSn", "SD_Eef",
            "SD_CtG", "SD_EsD", "SD_F0H", "SD_FiH", "SD_DQr",
            "SD_openShaderScreen"
          ]) fn(name);

          for (const name of ["SD_Biu", "CK", "SD_G$M"]) {
            const needle = `(${name},`;
            let from = 0;
            while ((from = code.indexOf(needle, from)) >= 0) {
              console.log(`--- metadata around ${name} @ ${from} ---`);
              console.log(code.slice(Math.max(0, from - 500), from + 1500));
              from += needle.length;
            }
          }

          const segments = code.split("\nfunction ");
          const matches = segments
            .filter((segment) => segment.includes(".ft"))
            .filter((segment) => /^SD_/.test(segment))
            .slice(0, 80);
          console.log(`--- SD functions containing .ft: ${matches.length} ---`);
          for (const segment of matches) {
            console.log("function " + segment.slice(0, 2500));
          }
          NODE
