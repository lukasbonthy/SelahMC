name: Inspect deferred shader GUI ABI

on:
  push:
    branches: ["inspect-v8.3.11"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stability-v8.3.10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download pinned client
        run: |
          set -euo pipefail
          mkdir -p recovered-live
          curl --fail --location --retry 3 https://selahmc.me/client/selahmc-client-v8.3.3.js --output recovered-live/selahmc-client-v8.3.3.js
      - name: Print config field producers and consumers
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { transformBundle } from "./lifecycle-repair/tools/build-lifecycle-repair.mjs";
          import { extractGeneratedFunction } from "./lifecycle-repair/tests/helpers/extract-generated-function.mjs";
          const source = readFileSync("recovered-live/selahmc-client-v8.3.3.js", "utf8");
          const barrier = readFileSync("lifecycle-repair/src/world-lifecycle-barrier.js", "utf8");
          const { code } = transformBundle(source, barrier);

          for (const name of [
            "SD_BUt", "SD_Eim", "SD_G$M", "SD_G$N", "SD_EkU",
            "SD_openShaderScreen"
          ]) {
            try {
              console.log(`--- ${name} ---`);
              console.log(extractGeneratedFunction(code, name));
            } catch (err) {
              console.log(`missing ${name}: ${err.message}`);
            }
          }

          function printContaining(needle) {
            const seen = new Set();
            let cursor = 0;
            let count = 0;
            while ((cursor = code.indexOf(needle, cursor)) >= 0) {
              let start = code.lastIndexOf("\nfunction ", cursor);
              start = start < 0 ? 0 : start + 1;
              let end = code.indexOf("\nfunction ", cursor);
              end = end < 0 ? code.length : end;
              const name = /^function ([^(]+)/.exec(code.slice(start, start + 120))?.[1] ?? `offset-${cursor}`;
              if (!seen.has(name)) {
                seen.add(name);
                count++;
                console.log(`--- contains ${needle}: ${name} @ ${cursor} ---`);
                console.log(code.slice(start, Math.min(end, start + 12000)));
              }
              cursor += needle.length;
            }
            console.log(`--- total functions containing ${needle}: ${count} ---`);
          }

          for (const needle of [".xS", ".ft", "xS=", ".ft="]) printContaining(needle);

          for (const needle of ["SD_Biu,0,CK", "SD_BfL,0,", "SD_G$M"]) {
            const at = code.indexOf(needle);
            console.log(`--- raw ${needle} @ ${at} ---`);
            console.log(code.slice(Math.max(0, at - 1200), at + 5000));
          }
          NODE
