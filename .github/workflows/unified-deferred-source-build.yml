name: Selah unified deferred source build

on:
  push:
    branches: [ selah-unified-deferred-source ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone exact 1.12.2 renderer baseline
        run: |
          git clone https://github.com/lenabena67/eaglercraft-base-client.git work
          cd work
          git checkout 9d055f6f9cb40322768625226377508542e74a50
      - name: Clone native deferred renderer source
        run: |
          git clone https://github.com/Eaglercraft-Archive/EaglercraftX-1.8-workspace.git deferred-upstream
          cd deferred-upstream
          git checkout 746793a11eb67608b4e60660a4dfe205f5f68970
      - name: Port deferred source into the 1.12 tree
        run: python3 tools/port_deferred_source.py work deferred-upstream
      - name: Compile one TeaVM classes.js
        working-directory: work
        run: |
          rm -f javascript/classes.js javascript/classes.js.map
          printf '\ntasks.withType(JavaCompile).configureEach { options.compilerArgs += ["-Xmaxerrs", "1000"] }\n' >> build.gradle
          chmod +x gradlew
          ./gradlew generateJavascript --stacktrace
      - name: Prove one source-built core
        run: |
          test -s work/javascript/classes.js
          test -s work/javascript/classes.js.map
          echo "classes.js bytes: $(wc -c < work/javascript/classes.js)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: selah-unified-source-build
          path: |
            work/javascript/classes.js
            work/javascript/classes.js.map
            work/javascript/assets.epk
          if-no-files-found: error
