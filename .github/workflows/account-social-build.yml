name: Account Social Build

on:
  pull_request:
    paths:
      - 'selahmc-account-social/**'
      - '.github/workflows/account-social-build.yml'
  push:
    branches:
      - account-social-v3.0
    paths:
      - 'selahmc-account-social/**'
      - '.github/workflows/account-social-build.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selahmc-account-social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Java and build shaded plugin
        run: |
          if ! mvn --batch-mode --no-transfer-progress clean verify > /tmp/selah-maven.log 2>&1; then
            echo '===== MAVEN FAILURE ====='
            tail -140 /tmp/selah-maven.log
            exit 1
          fi
          tail -35 /tmp/selah-maven.log
      - name: Validate browser JavaScript
        run: node --check web/app.js
      - name: Validate shell scripts
        run: bash -n install.sh configure-caddy.sh
      - name: Verify plugin archive contains metadata
        run: |
          test -s target/SelahMCAccountSocial.jar
          jar tf target/SelahMCAccountSocial.jar | grep -qx 'plugin.yml'
